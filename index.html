<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type-C ElectroDiag Pro — USB-C Electronic Instrument Diagnostics &amp; Repairability Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        labBg: '#090d16',
                        labCard: '#111827',
                        labSub: '#0c1220',
                        labCyan: '#00f0ff',
                    },
                    animation: {
                        'scan-sweep': 'scanSweep 1.1s ease-in-out infinite',
                    },
                    keyframes: {
                        scanSweep: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(220%)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Dark-mode hardware engineering laboratory grid background */
        body {
            background-color: #090d16;
            background-image:
                radial-gradient(circle at 12% 8%, rgba(0, 240, 255, 0.08) 0%, transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(16, 185, 129, 0.06) 0%, transparent 42%),
                linear-gradient(to right, rgba(30, 41, 59, 0.28) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.28) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Custom precision probe sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: #1e293b;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #00f0ff;
            border: 2px solid #090d16;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.65);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #67f7ff;
        }

        /* Animated SVG PCB trace current flow */
        @keyframes dashFlow {
            to { stroke-dashoffset: -24; }
        }
        .wire-flow-healthy {
            stroke-dasharray: 6 6;
            animation: dashFlow 0.75s linear infinite;
        }
        .wire-flow-warning {
            stroke-dasharray: 4 8;
            animation: dashFlow 1.4s linear infinite;
        }
        @keyframes pulseCrimson {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.55)); }
            50% { filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.95)); }
        }
        .node-fault-pulse {
            animation: pulseCrimson 1.15s ease-in-out infinite;
        }

        /* Custom scrollbar for terminal console */
        .console-scroll::-webkit-scrollbar { width: 6px; }
        .console-scroll::-webkit-scrollbar-track { background: #090d16; }
        .console-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-400/30 selection:text-cyan-100">

    <!-- Toast Notification Stack -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- 1. TOP HEADER & HARDWARE ACTION CONTROLS -->
    <header class="sticky top-0 z-30 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800/90">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
            
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-[#00f0ff]/40 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.18)] shrink-0">
                    <svg class="w-6 h-6 text-[#00f0ff]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="10" rx="5" />
                        <line x1="6" y1="12" x2="18" y2="12" stroke-linecap="round" />
                        <circle cx="8" cy="12" r="0.8" fill="currentColor" />
                        <circle cx="16" cy="12" r="0.8" fill="currentColor" />
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white">
                            Type-C <span class="text-[#00f0ff]">ElectroDiag</span> Pro
                        </h1>
                        <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono font-semibold bg-cyan-950/90 text-[#00f0ff] border border-cyan-700/60">
                            LAB BENCH v4.2
                        </span>
                    </div>
                    <p id="detectedDeviceBanner" class="text-xs text-slate-400">USB-C Electronic Instrument Diagnostics &amp; Repairability Analyzer</p>
                </div>
            </div>

            <!-- Action Buttons: Tone Toggle, Detect Instrument (MIDI), WebSerial, WebUSB, Sweep -->
            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
                <button id="soundToggleBtn" onclick="toggleAudio()" title="Toggle Lab Acoustic Feedback"
                    class="p-2.5 rounded-xl bg-[#111827] hover:bg-slate-800 border border-slate-700/80 text-slate-300 transition flex items-center gap-1.5 text-xs font-medium cursor-pointer">
                    <svg id="soundIconOn" class="w-4 h-4 text-[#00f0ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <svg id="soundIconOff" class="w-4 h-4 text-slate-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                    <span class="hidden xl:inline">Tone</span>
                </button>

                <button onclick="initMidiDetection(true)"
                    class="px-3.5 py-2.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-emerald-300 transition flex items-center gap-2 text-xs font-semibold cursor-pointer">
                    <span id="midiStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span>Detect Instrument</span>
                </button>

                <button onclick="connectSerialDevice()"
                    class="px-3.5 py-2.5 rounded-xl bg-[#111827] hover:bg-slate-800 border border-slate-700/80 text-slate-200 transition flex items-center gap-2 text-xs font-semibold cursor-pointer">
                    <span id="serialStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span>WebSerial</span>
                </button>

                <button onclick="connectUsbDevice()"
                    class="px-3.5 py-2.5 rounded-xl bg-[#111827] hover:bg-slate-800 border border-slate-700/80 text-slate-200 transition flex items-center gap-2 text-xs font-semibold cursor-pointer">
                    <span id="usbStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span>WebUSB</span>
                </button>

                <button onclick="runAutoSweep()"
                    class="px-3.5 py-2.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-[#00f0ff]/40 text-[#00f0ff] transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer">
                    <span>Full Sweep</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 2. MAIN DIAGNOSTIC WORKBENCH -->
    <main class="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Instrument Link, Fault Presets & Probe Sliders -->
        <section class="lg:col-span-4 flex flex-col gap-5">

            <!-- Connected USB-C Instrument Card -->
