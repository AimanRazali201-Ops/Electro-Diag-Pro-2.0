<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type-C ElectroDiag Pro — Hardware Diagnostic Lab</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --sub: #0c1220;
            --border: #1e293b;
            --cyan: #00f0ff;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #ef4444;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 12% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 42%),
                linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.45;
        }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        header {
            position: sticky; top: 0; z-index: 20;
            background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
        }
        .header-inner {
            max-width: 1380px; margin: 0 auto;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.4);
            display: flex; align-items: center; justify-content: center; color: var(--cyan);
        }
        .brand h1 { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .brand h1 span { color: var(--cyan); }
        .badge {
            font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
            background: rgba(0, 240, 255, 0.12); color: var(--cyan); border: 1px solid rgba(0, 240, 255, 0.35);
        }
        .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
        button {
            cursor: pointer; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600;
            border: 1px solid var(--border); background: var(--card); color: var(--text);
            display: inline-flex; align-items: center; gap: 7px; transition: 0.15s;
        }
        button:hover { background: #1e293b; }
        .btn-midi { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.12); color: #6ee7b7; }
        .btn-serial { border-color: rgba(0, 240, 255, 0.45); background: rgba(0, 240, 255, 0.12); color: var(--cyan); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; }
        .dot.active { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

        main {
            max-width: 1380px; margin: 0 auto; padding: 20px;
            display: grid; grid-template-columns: 380px 1fr; gap: 20px;
        }
        @media (max-width: 960px) { main { grid-template-columns: 1fr; } }

        .col { display: flex; flex-direction: column; gap: 18px; }
        .card {
            background: rgba(17, 24, 39, 0.92); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }
        .card-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted); font-weight: 700; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-box {
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; font-size: 12px; color: var(--muted);
        }
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .preset-btn {
            flex-direction: column; align-items: flex-start; gap: 2px;
            background: var(--sub); padding: 10px; border-radius: 10px; text-align: left;
        }
        .slider-row { margin-bottom: 14px; }
        .slider-row:last-child { margin-bottom: 0; }
        .slider-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .slider-val { color: var(--cyan); font-weight: 700; }
        input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
            background: #1e293b; border-radius: 999px; outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 17px; height: 17px; border-radius: 50%;
            background: var(--cyan); border: 2px solid var(--bg); box-shadow: 0 0 10px rgba(0,240,255,0.6);
        }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        @media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }
        .kpi { background: rgba(17, 24, 39, 0.92); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .kpi-label { font-size: 10px; color: var(--muted); font-weight: 700; }
        .kpi-num { font-size: 1.4rem; font-weight: 800; color: #fff; margin: 4px 0 2px; }
        .kpi-sub { font-size: 11px; color: var(--emerald); }

        .svg-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; overflow-x: auto; }
        @keyframes dashFlow { to { stroke-dashoffset: -24; } }
        .wire-flow { stroke-dasharray: 6 6; animation: dashFlow 0.75s linear infinite; }

        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        @media (max-width: 768px) { .bottom-grid { grid-template-columns: 1fr; } }
        .diag-item { padding: 12px; border-radius: 10px; font-size: 12px; border: 1px solid; margin-bottom: 8px; }
        .diag-ok { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.35); color: #a7f3d0; }
        .diag-warn { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.35); color: #fde68a; }
        .diag-crit { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.4); color: #fecaca; }

        .console {
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px; height: 170px; overflow-y: auto; font-size: 11px;
            display: flex; flex-direction: column; gap: 5px;
        }
        #toastContainer {
            position: fixed; bottom: 16px; right: 16px; z-index: 50;
            display: flex; flex-direction: column; gap: 8px; max-width: 340px;
        }
        .toast {
            background: var(--card); border: 1px solid var(--cyan); color: #cffafe;
            padding: 10px 14px; border-radius: 10px; font-size: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="toastContainer"></div>

    <header>
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="10" rx="5"></rect>
                        <line x1="6" y1="12" x2="18" y2="12" stroke-linecap="round"></line>
                    </svg>
                </div>
                <div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <h1>Type-C <span>ElectroDiag</span> Pro</h1>
                        <span class="badge mono">REV 3.2 STANDALONE</span>
                    </div>
                    <div id="detectedDeviceBanner" class="subtitle">Plug Type-C cable to instrument &amp; click Detect Instrument</div>
                </div>
            </div>

            <div class="btn-group">
                <button onclick="toggleAudio()"><span style="color:var(--cyan)">Audio</span></button>
                <button class="btn-midi" onclick="initMidiDetection(true)">
                    <span id="midiStatusDot" class="dot"></span>
                    <span>Detect Instrument (MIDI)</span>
                </button>
                <button class="btn-serial" onclick="connectSerialDevice()">
                    <span id="serialStatusDot" class="dot"></span>
                    <span>Sensor Bridge (Serial)</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="col">
            <div class="card">
                <div class="card-title mono">
                    <span>Connected USB-C Instrument</span>
                    <span id="usbLinkBadge" class="badge">OFFLINE</span>
                </div>
                <div id="instrumentInfoBox" class="info-box mono">
                    Waiting for USB-C instrument... Connect a data-capable Type-C cable, turn ON your instrument, and click <b>Detect Instrument (MIDI)</b>.
                </div>
            </div>

            <div class="card">
                <div class="card-title mono">
                    <span>Quick Fault Presets</span>
                    <a href="javascript:void(0)" onclick="runAutoSweep()" style="color:var(--cyan);text-decoration:none;">Auto-Scan</a>
                </div>
                <div class="preset-grid">
                    <button class="preset-btn" onclick="applyPreset('pd20v')">
